<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Home Screen App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Weeks Without Jeremy">
    
    <!-- iOS App Icon (Replace icon.png with your icon file path) -->
    <link rel="apple-touch-icon" href="icon.png">       
    <meta name="theme-color" content="#111827">
    <title>Weeks Without Jeremy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Weeks Without My Boy</h1>

  <section id="result"></section>

  <footer>
    <p>May you rest in peace, Jeremy Fraser Nolan.</p>
    <p class="version"><span id="app-version">v0.0.3</span></p>
  </footer>

  

  <script src="script.js"></script>

  <!-- register the service worker script to enable offline capabilities -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.log('Registration failed:', err));
      });
    }
  </script>

  <div id="refresh-overlay" class="hidden-overlay">Updating App...</div>

</body>
</html>
