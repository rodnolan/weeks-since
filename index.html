<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS Home Screen App Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weeks Without Jeremy">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#111827">

  <title>Weeks Without Jeremy</title>

  <link rel="stylesheet" href="styles/layout2.css">
  <link rel="stylesheet" href="styles/typography.css">
  <link rel="stylesheet" href="styles/dark-mode.css">
  <link rel="stylesheet" href="styles/3x3-today-box-layout.css">
</head>

<body>

  <section class="app-container">

    <h1>Weeks Without My Boy</h1>

    <main class="main-layout whole-week">
      <div class="grid-box">
        <div data-id="birth-date"><!--Friday<br />November 16<br />2001 --></div>
      </div>
      <div class="grid-box">
        <div>
          <span data-id="life-weeks" class="number-callout"><!--1257--></span>
          <span>weeks</span>
        </div>
      </div>
      <div class="grid-box">
        <div data-id="death-date"><!--Friday<br />December 19<br />2025--></div>
      </div>
      <div class="grid-box">
        <div>
          <span data-id="post-life-weeks" class="number-callout"><!--38--></span>
          <span>weeks</span>
        </div>
      </div>
      <div class="grid-box">
        <div id="today-date" data-id="today-date"><!--Friday<br />September 11<br />2026--></div>
      </div>
    </main>

    <main class="main-layout partial-week">
      <div class="grid-box">
        <div data-id="birth-date"><!--Friday<br />November 16<br />2001 --></div>
      </div>
      <div class="grid-box">
        <div>
          <span data-id="life-weeks" class="number-callout"><!--1257--></span>
          <span>weeks</span>
        </div>
      </div>
      <div class="grid-box">
        <div data-id="death-date"><!--Friday<br />December 19<br />2025--></div>
      </div>
      <div class="grid-box diag-box">
        <div data-id="last-whole-weeks-elapsed" class="lastWholeWeeksElapsed number-callout"><!--37--></div>
        <div id="today-date" data-id="today-date"><!--Thursday<br />September 10<br />2026--></div>
        <div data-id="next-whole-weeks-elapsed" class="nextWholeWeeksElapsed number-callout"><!--38--></div>
      </div>
    </main>

    <footer>
      <div class="rip">Weeks Without My Boy &mdash; <span id="app-version">v1.0.0</span> &mdash; &copy; 2026 Rod Nolan</div>
    </footer>

  </section>

  <script src="scripts/refreshHandler.js"></script>
  <script src="scripts/layout-toggler.js"></script>
  <script src="scripts/sw-register.js"></script>
  <script src="app.js"></script>
  <div id="refresh-overlay" class="hidden-overlay">Updating App...</div>
</body>

</html>
